<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning &amp; Development Hub</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="hub">
    <header class="hub-head">
      <div>
        <div class="kicker">Book notes</div>
        <h1>Learning &amp; Development Hub</h1>
        <p>Notes and highlights from the books I read, turned into short interactive decks.</p>
      </div>
      <button class="chip" data-action="theme" title="Switch light / dark">Theme</button>
    </header>

    <div class="filters" aria-label="Filter by category"></div>
    <div class="book-grid"></div>
  </main>

  <script src="assets/books.js"></script>
  <script src="assets/deck.js"></script>
  <script src="assets/hub.js"></script>
</body>
</html>
